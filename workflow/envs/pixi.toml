[workspace]
name = "wgs-smk-envs"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]
preview = ["pixi-build"]

[dependencies]
python = "3.15.*"
bcftools = "==1.24"
dragmap = "==1.3.0"
# bioconda pins it to openjdk 17. Picard runs ~30% faster on 25.
gatk4-main = { path = "gatk4-main" }
htslib = "==1.24"
# 5x faster than gawk at routing reads by read group.
mawk = "==1.3.4"
openjdk = "25.*"
picard = "==3.5.0"
r-base = "4.5.*"
samtools = "==1.24"
verifybamid2 = "==2.0.3"
