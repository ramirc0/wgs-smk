samples: .tests/plumbing/samples.tsv
outdir: results
pixi_env: default
run_id: plumbing
picard_tmp_dir: .picard

references:
  fasta: /data/zusers/ramirezc/static/hg38/genome/GRCh38_no_alt_analysis_set_GCA_000001405.15.fasta
  haplotype_database_file: /data/zusers/ramirezc/static/hg38/broad-references/v0/Homo_sapiens_assembly38.haplotype_database.txt
  dbsnp_vcf: /data/zusers/ramirezc/static/hg38/broad-references/v0/Homo_sapiens_assembly38.dbsnp138.vcf.gz
  calling_interval_list: /data/zusers/ramirezc/static/hg38/broad-references/v0/wgs_calling_regions.hg38.interval_list
  evaluation_interval_list: /data/zusers/ramirezc/static/hg38/broad-references/v0/wgs_evaluation_regions.hg38.interval_list
  coverage_interval_list: /data/zusers/ramirezc/static/hg38/broad-references/v0/wgs_coverage_regions.hg38.interval_list
  contamination_sites: /data/zusers/ramirezc/static/hg38/broad-references/v0/contamination-resources/1000g/1000g.phase3.100k.b38.vcf.gz.dat

platform: Illumina
compression_level: 2
lod_threshold: -20.0
cross_check_fingerprints_by: READGROUP
contamination_underestimation_factor: 0.75
split_large_read_group:
  cutoff_gib: 0.207
  reads_per_file: 1000000
scatter_interval_list:
  scatter_count: 50
  break_bands_at_multiples_of: 1000000
