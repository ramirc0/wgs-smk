# Local execution.
software-deployment-method:
  - pixi
# Snakemake copies every env package here. pixi installs from its own cache.
# One copy per user instead of one per workdir.
software-deployment-cache-prefix: ~/.cache/snakemake/software

cores: 52
printshellcmds: true
rerun-incomplete: true
keep-going: true
show-failed-logs: true
retries: 1
benchmark-extended: true

default-resources:          # reference_index uses these as they are
  mem_mb: 4000
  runtime: 240

set-threads:
  dragen_index: 52
  compose_str_table: 2
  unmapped_bam: 4
  collect_quality_yield_metrics: 2
  unmapped_bam_to_aligned: 16
  gather_unsorted_bam_files: 2
  collect_unsorted_readgroup_bam_quality_metrics: 2
  mark_duplicates: 2
  sort_bam: 16
  cross_check_fingerprints: 2
  check_contamination: 4
  collect_readgroup_bam_quality_metrics: 2
  collect_aggregation_metrics: 2
  calculate_readgroup_checksum: 2
  collect_wgs_metrics: 2
  collect_raw_wgs_metrics: 2
  convert_to_cram: 16
  check_prevalidation: 1
  validate_sam_file: 2
  calibrate_dragen_str_model: 4
  scatter_interval_list: 1
  haplotype_caller: 4
  dragen_hardfilter_gvcf: 2
  merge_gvcfs: 2
  reblock: 2
  validate_gvcf: 2
  collect_variant_calling_metrics: 2

set-resources:              # tune from benchmarks/ TSVs after a real run
  dragen_index: {mem_mb: 500000}
  compose_str_table: {mem_mb: 16000}
  unmapped_bam: {mem_mb: 48000}
  collect_quality_yield_metrics: {mem_mb: 4000}
  unmapped_bam_to_aligned: {mem_mb: 72000}
  gather_unsorted_bam_files: {mem_mb: 4000}
  collect_unsorted_readgroup_bam_quality_metrics: {mem_mb: 8000}
  mark_duplicates: {mem_mb: 32000}
  sort_bam: {mem_mb: 40000}
  cross_check_fingerprints: {mem_mb: 4000}
  check_contamination: {mem_mb: 8000}
  collect_readgroup_bam_quality_metrics: {mem_mb: 8000}
  collect_aggregation_metrics: {mem_mb: 8000}
  calculate_readgroup_checksum: {mem_mb: 4000}
  collect_wgs_metrics: {mem_mb: 8000}
  collect_raw_wgs_metrics: {mem_mb: 8000}
  convert_to_cram: {mem_mb: 8000}
  check_prevalidation: {mem_mb: 1000}
  validate_sam_file: {mem_mb: 16000}
  calibrate_dragen_str_model: {mem_mb: 8000}
  scatter_interval_list: {mem_mb: 2000}
  haplotype_caller: {mem_mb: 12000}
  dragen_hardfilter_gvcf: {mem_mb: 4000}
  merge_gvcfs: {mem_mb: 4000}
  reblock: {mem_mb: 8000}
  validate_gvcf: {mem_mb: 8000}
  collect_variant_calling_metrics: {mem_mb: 8000}
