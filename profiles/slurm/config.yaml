executor: slurm
software-deployment-method:
  - pixi
# Snakemake copies every env package here. pixi installs from its own cache.
# One copy per user instead of one per workdir.
software-deployment-cache-prefix: ~/.cache/snakemake/software

jobs: unlimited
max-jobs-per-timespan: 5/1s
# With unlimited jobs every ready job is submitted, so ILP's per-batch solve buys
# nothing. Greedy starts big-input jobs first, so give a small blocking rule `priority:`.
scheduler: greedy

slurm-efficiency-report: true
slurm-efficiency-report-path: logs/efficiency
slurm-efficiency-threshold: 0.8
slurm-init-seconds-before-status-checks: 10

default-resources:          # reference_index uses these as they are
  slurm_partition: 4hours
  runtime: 240m
  mem_mb: 4000 * attempt
  # z1061 has ~200 GiB of /tmp. unmapped_bam routes a 30x genome there uncompressed.
  slurm_extra: "--exclude=z[1024,1061,1062,1068] --cpu-freq=High-High:Performance"

set-threads:
  dragen_index: 52
  compose_str_table: 2
  unmapped_bam: 4
  collect_quality_yield_metrics: 2
  unmapped_bam_to_aligned: 16
  gather_unsorted_bam_files: 2
  collect_unsorted_readgroup_bam_quality_metrics: 2
  mark_duplicates: 2
  sort_bam: 16
  cross_check_fingerprints: 2
  check_contamination: 4
  collect_readgroup_bam_quality_metrics: 2
  collect_aggregation_metrics: 2
  calculate_readgroup_checksum: 2
  collect_wgs_metrics: 2
  collect_raw_wgs_metrics: 2
  convert_to_cram: 16
  check_prevalidation: 1
  validate_sam_file: 2
  calibrate_dragen_str_model: 4
  scatter_interval_list: 1
  haplotype_caller: 4
  dragen_hardfilter_gvcf: 2
  merge_gvcfs: 2
  reblock: 2
  validate_gvcf: 2
  collect_variant_calling_metrics: 2

set-resources:              # tune from benchmarks/ TSVs after a real run
  dragen_index:
    mem_mb: 128000 * attempt
    constraint: cascadelake
  compose_str_table:
    mem_mb: 16000 * attempt
  unmapped_bam:
    mem_mb: 48000 * attempt
    slurm_partition: 12hours
    runtime: 720m
    constraint: cascadelake
  collect_quality_yield_metrics:
    mem_mb: 4000 * attempt
    constraint: cascadelake
  unmapped_bam_to_aligned:
    mem_mb: 72000 * attempt
    slurm_partition: 12hours
    runtime: 720m
    constraint: cascadelake
  gather_unsorted_bam_files:
    mem_mb: 4000 * attempt
    constraint: cascadelake
  collect_unsorted_readgroup_bam_quality_metrics:
    mem_mb: 8000 * attempt
    constraint: cascadelake
  mark_duplicates:
    mem_mb: 32000 * attempt
    slurm_partition: 12hours
    runtime: 720m
    constraint: cascadelake
  sort_bam:                 # samtools sort -m 2G: at least 2 GB per thread
    mem_mb: 40000 * attempt
    constraint: cascadelake
  cross_check_fingerprints:
    mem_mb: 4000 * attempt
    constraint: cascadelake
  check_contamination:
    mem_mb: 8000 * attempt
    constraint: cascadelake
  collect_readgroup_bam_quality_metrics:
    mem_mb: 8000 * attempt
    constraint: cascadelake
  collect_aggregation_metrics:
    mem_mb: 8000 * attempt
    slurm_partition: 12hours
    runtime: 720m
    constraint: cascadelake
  calculate_readgroup_checksum:
    mem_mb: 4000 * attempt
    constraint: cascadelake
  collect_wgs_metrics:
    mem_mb: 8000 * attempt
    slurm_partition: 12hours
    runtime: 720m
    constraint: cascadelake
  collect_raw_wgs_metrics:
    mem_mb: 8000 * attempt
    slurm_partition: 12hours
    runtime: 720m
    constraint: cascadelake
  convert_to_cram:
    mem_mb: 8000 * attempt
    constraint: cascadelake
  check_prevalidation:
    mem_mb: 1000 * attempt
    slurm_partition: 30mins
    runtime: 30m
  validate_sam_file:
    mem_mb: 16000 * attempt
    slurm_partition: 12hours
    runtime: 720m
    constraint: cascadelake
  calibrate_dragen_str_model:
    mem_mb: 8000 * attempt
  scatter_interval_list:
    mem_mb: 2000 * attempt
    slurm_partition: 30mins
    runtime: 30m
  haplotype_caller:
    mem_mb: 12000 * attempt
    slurm_partition: 12hours,5days
    runtime: 720m
    constraint: cascadelake
  dragen_hardfilter_gvcf:
    mem_mb: 4000 * attempt
    slurm_partition: 12hours
    runtime: 720m
  merge_gvcfs:
    mem_mb: 4000 * attempt
    constraint: cascadelake
  reblock:
    mem_mb: 8000 * attempt
    slurm_partition: 12hours
    runtime: 720m
    constraint: cascadelake
  validate_gvcf:
    mem_mb: 8000 * attempt
    constraint: cascadelake
  collect_variant_calling_metrics:
    mem_mb: 8000 * attempt
    constraint: cascadelake

rerun-incomplete: true
keep-going: true
show-failed-logs: true
benchmark-extended: true
retries: 1
slurm-requeue: false
printshellcmds: true
latency-wait: 60
