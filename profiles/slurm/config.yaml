executor: slurm
software-deployment-method:
  - pixi
# Snakemake copies every env package here. pixi installs from its own cache.
# One copy per user instead of one per workdir.
software-deployment-cache-prefix: ~/.cache/snakemake/software

jobs: unlimited
max-jobs-per-second: 5

slurm-efficiency-report: true
slurm-efficiency-report-path: logs/efficiency
slurm-efficiency-threshold: 0.8

default-resources:          # reference_index uses these as they are
  slurm_partition: 4hours
  runtime: 240m
  mem_mb: 4000 * attempt
  slurm_extra: "--exclude=z[1024,1062,1068] --cpu-freq=High-High:Performance"

set-threads:
  dragen_index: 52
  unmapped_bam: 26
  collect_quality_yield_metrics: 4
  unmapped_bam_to_aligned: 52
  collect_unsorted_readgroup_bam_quality_metrics: 4
  mark_duplicates: 26
  sort_bam: 26
  cross_check_fingerprints: 13
  base_recalibration: 6
  check_contamination: 13
  gather_bqsr_reports: 13
  apply_bqsr: 13
  gather_recalibrated_bams: 13
  collect_readgroup_bam_quality_metrics: 13
  collect_aggregation_metrics: 13
  calculate_readgroup_checksum: 13
  convert_to_cram: 26
  check_prevalidation: 6
  validate_sam_file: 13
  calibrate_dragen_str_model: 26
  scatter_interval_list: 6
  haplotype_caller: 26
  dragen_hardfilter_gvcf: 13
  merge_gvcfs: 26
  sort_bamout: 13
  merge_bamout: 26
  reblock: 13
  validate_gvcf: 6
  collect_variant_calling_metrics: 13

set-resources:              # tune from benchmarks/ TSVs after a real run
  dragen_index:
    mem_mb: 500000 * attempt
    constraint: cascadelake
  unmapped_bam:
    mem_mb: 250000 * attempt
    slurm_partition: 12hours
    runtime: 720m
    constraint: cascadelake
  collect_quality_yield_metrics:
    mem_mb: 32000 * attempt
    constraint: cascadelake
  unmapped_bam_to_aligned:
    mem_mb: 500000 * attempt
    slurm_partition: 5days
    runtime: 7200m
    constraint: cascadelake
  collect_unsorted_readgroup_bam_quality_metrics:
    mem_mb: 32000 * attempt
    constraint: cascadelake
  mark_duplicates:
    mem_mb: 250000 * attempt
    slurm_partition: 12hours
    runtime: 720m
    constraint: cascadelake
  sort_bam:                 # samtools sort -m 2G: at least 2 GB per thread
    mem_mb: 250000 * attempt
    constraint: cascadelake
  cross_check_fingerprints:
    mem_mb: 125000 * attempt
    constraint: cascadelake
  base_recalibration:
    mem_mb: 62500 * attempt
    constraint: cascadelake
  check_contamination:
    mem_mb: 125000 * attempt
    constraint: cascadelake
  gather_bqsr_reports:
    mem_mb: 125000 * attempt
    constraint: cascadelake
  apply_bqsr:
    mem_mb: 125000 * attempt
    constraint: cascadelake
  gather_recalibrated_bams:
    mem_mb: 125000 * attempt
  collect_readgroup_bam_quality_metrics:
    mem_mb: 125000 * attempt
    constraint: cascadelake
  collect_aggregation_metrics:
    mem_mb: 125000 * attempt
    slurm_partition: 12hours
    runtime: 720m
    constraint: cascadelake
  calculate_readgroup_checksum:
    mem_mb: 125000 * attempt
    constraint: cascadelake
  convert_to_cram:
    mem_mb: 250000 * attempt
    constraint: cascadelake
  check_prevalidation:
    mem_mb: 62500 * attempt
    slurm_partition: 30mins
    runtime: 30m
  validate_sam_file:
    mem_mb: 125000 * attempt
    slurm_partition: 12hours
    runtime: 720m
    constraint: cascadelake
  calibrate_dragen_str_model:
    mem_mb: 250000 * attempt
  scatter_interval_list:
    mem_mb: 62500 * attempt
    slurm_partition: 30mins
    runtime: 30m
    constraint: cascadelake
  haplotype_caller:
    mem_mb: 250000 * attempt
    slurm_partition: 12hours,5days
    runtime: 720m
    constraint: cascadelake
  dragen_hardfilter_gvcf:
    mem_mb: 125000 * attempt
    slurm_partition: 12hours
    runtime: 720m
  merge_gvcfs:
    mem_mb: 250000 * attempt
    constraint: cascadelake
  sort_bamout:
    mem_mb: 125000 * attempt
    constraint: cascadelake
  merge_bamout:
    mem_mb: 250000 * attempt
  reblock:
    mem_mb: 125000 * attempt
    slurm_partition: 12hours
    runtime: 720m
    constraint: cascadelake
  validate_gvcf:
    mem_mb: 62500 * attempt
    constraint: cascadelake
  collect_variant_calling_metrics:
    mem_mb: 125000 * attempt
    constraint: cascadelake

rerun-incomplete: true
keep-going: true
show-failed-logs: true
benchmark-extended: true
retries: 1
slurm-requeue: false
printshellcmds: true
latency-wait: 60
